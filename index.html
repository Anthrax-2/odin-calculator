<!doctype html>
<html lang="en">
    <head>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculator</title>
    </head>
    <body>
        <div class="box">
            <div class="output-field">
                <input type="text" id="output" readonly />
            </div>
            <div class="buttons">
                <div class="row">
                    <button >1</button>
                    <button >2</button>
                    <button >3</button>
                    <button class="operator">+</button>
                </div>
                <div class="row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">-</button>
                </div>
                <div class="row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operator">*</button>
                </div>
                <div class="row">
                    <button id="point">.</button>
                    <button>0</button>
                    <button id="equal">=</button>
                    <button class="operator">/</button>
                </div>
                <div class="row">
                    <button id="backspace">◀</button>
                    <button id="clear">c</button>
                </div>
            </div>
        </div>
    </body>
</html>
